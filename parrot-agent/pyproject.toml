[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parrot-agent"
version = "0.1.0"
description = "Reliable remote execution engine for Parrot Ops Skill YAML"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Sumrain"}]
keywords = ["devops", "automation", "skill", "execution", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
parrot-agent = "agent.cli:main"

[project.urls]
Homepage = "https://github.com/sumrainchan/parrot-ops"

[tool.setuptools.packages.find]
where = ["src"]
